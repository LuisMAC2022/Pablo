{% extends "base.html" %}

{% block title %}Registro exitoso | Pabellón Nacional de la Biodiversidad{% endblock %}

{% block body %}
<main id="contenido-principal" class="confirmation-panel confirmation-panel--compact page-main">
  <div class="success-mark" aria-hidden="true">✓</div>
  <p class="eyebrow">Visitantes</p>
  <h1>Registro exitoso</h1>
  <p role="status" class="alert">Se registraron <strong class="mono">{{ cantidad }}</strong> visitantes.</p>

  <nav class="confirmation-actions" aria-label="Acciones del registro">
    <a class="btn" href="/visitantes">Nuevo registro</a>
    <a class="btn btn--ghost" href="/inicio">Inicio</a>
  </nav>
</main>
{% endblock %}
